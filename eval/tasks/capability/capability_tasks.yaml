query: "So sánh nghiên cứu về MRBAYES và thuật toán UBLAST trong phân tích trình tự sinh học."
expected_doc_ids:
  - "doc_115043"
  - "doc_115045"
reference_answer: "MRBAYES dùng phương pháp chuỗi Markov Monte Carlo (MCMC) trong suy luận Bayes để xây dựng cây phát sinh loài, trong khi UBLAST/USEARCH tập trung vào thuật toán heuristics tốc độ cao để tìm kiếm và gom cụm cơ sở dữ liệu trình tự lớn."
reference_solution:
  key_points:
    - "MRBAYES: MCMC, Bayesian inference"
    - "USEARCH/UBLAST: sequence search and clustering"
graders:
  - name: "retrieval"
    params:
      thresholds:
        recall@5: 0.5
        precision@5: 0.2
  - name: "groundedness"
  - name: "coverage"
  - name: "language_relevance"
