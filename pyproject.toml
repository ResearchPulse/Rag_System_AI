[tool.poetry]
name = "rag-system-ai"
version = "0.1.0"
description = "Scientific Journal Publication Trend Tracking RAG System - Modular Monolith Architecture"
authors = ["ResearchPulse Team <team@researchpulse.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
asyncpg = "^0.29.0"
pgvector = "^0.2.5"
neo4j = "^5.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
