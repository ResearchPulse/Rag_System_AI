version: "3.8"

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-system-ai-app
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Rag_System_AI
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - VECTOR_DB_TYPE=qdrant
      - VECTOR_DB_HOST=qdrant
      - VECTOR_DB_PORT=6333
      - EMBEDDING_MODEL=text-embedding-3-small
      - LLM_PROVIDER=mock
      - LLM_MODEL=gpt-4o-mini
    depends_on:
      - qdrant
    networks:
      - rag-network
    restart: unless-stopped

  # Vector Database for Step 6 (Indexed Knowledge)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-system-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
