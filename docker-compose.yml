version: "3.8"

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-system-ai-app
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Rag_System_AI
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      # Vector Database: PostgreSQL with pgvector (managed via pgAdmin)
      - VECTOR_DB_TYPE=pgvector
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-researchpulse}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres123}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA:-public}
      # Knowledge Graph Database: Neo4j
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j123}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - EMBEDDING_MODEL=text-embedding-3-small
      - LLM_PROVIDER=mock
      - LLM_MODEL=gpt-4o-mini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge
