[tool.poetry]
name = "embedding-service"
version = "0.1.0"
description = "Embedding Service for Rag_System_AI - Generates high-dimensional vector embeddings for text chunks"
authors = ["ResearchPulse Team <team@researchpulse.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
